# Optional local MongoDB + Redis for development. Not needed if you use Atlas + Upstash.
# Start: npm run db:up   Stop: npm run db:down
services:
  mongo:
    image: mongo:8
    # Single-node replica set: MongoDB only supports transactions on replica sets.
    command: ['--replSet', 'rs0', '--bind_ip_all', '--port', '27017']
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initialises the replica set on first start, then just reports status.
      test: >
        echo "try { rs.status() } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }) }"
        | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  mongo-data:
  redis-data:
