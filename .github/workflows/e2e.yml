# Browser tests of the whole app (Playwright): the real client and API together, on an
# in-memory database with a pretend AI. Runs when either app changes.
name: E2E

on:
  push:
    branches: [main]
    paths: ["client/**", "server/**", ".github/workflows/e2e.yml"]
  pull_request:
    paths: ["client/**", "server/**", ".github/workflows/e2e.yml"]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: client/.nvmrc
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Cache MongoDB binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - run: npm run e2e
        working-directory: client
        env:
          CI: true

      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-traces
          path: client/test-results/
          retention-days: 7
