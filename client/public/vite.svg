<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded background shape with a dark slate gradient -->
  <rect width="32" height="32" rx="9" fill="url(#bgGrad)" />
  
  <!-- Outer glowing ring fragment -->
  <circle cx="16" cy="16" r="13" stroke="url(#ringGrad)" stroke-width="1.2" stroke-dasharray="64 20" opacity="0.8" />
  
  <!-- Elegant geometric stylized F / upward trend node -->
  <path d="M11 22V11C11 10.4477 11.4477 10 12 10H20C20.5523 10 21 10.4477 21 11" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M11 15.5H18" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" />
  <path d="M15 21.5L18 18.5L21.5 22" stroke="url(#trendGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="21.5" cy="22" r="1.5" fill="#34d399" />
  
  <defs>
    <!-- Dark slate gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ring gradient -->
    <linearGradient id="ringGrad" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.6" />
    </linearGradient>
    
    <!-- Neon cyan gradient -->
    <linearGradient id="accentGrad" x1="11" y1="10" x2="21" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    
    <!-- Neon green gradient for trend line -->
    <linearGradient id="trendGrad" x1="15" y1="18.5" x2="21.5" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
</svg>
