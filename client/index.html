<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Paisa Pal — an AI-powered personal finance tracker. Log expenses by typing, pasting bank SMS or scanning receipts."
    />
    <meta name="theme-color" content="#0f766e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Paisa Pal</title>
    <script>
      // Apply the saved theme before the page paints, so dark mode never flashes white.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('paisa-pal-ui') || '{}');
          var theme = (saved.state && saved.state.theme) || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
